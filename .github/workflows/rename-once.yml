name: One-shot rename to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename uploaded export to index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f index.html
          mv mold-removal-amarillo.html index.html
          git add -A
          git commit -m "Rename uploaded export to index.html as sole file" || echo "nothing to commit"
          git push
