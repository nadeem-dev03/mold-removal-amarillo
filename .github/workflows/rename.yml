name: Rename file

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git mv mold-removal-amarillo.html index.html
          git config user.name "nadeem-dev03"
          git config user.email "nadeem-dev03@users.noreply.github.com"
          git commit -m "Rename mold-removal-amarillo.html to index.html"
          git push
